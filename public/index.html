<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060914">
  <title>بوابة المناديب - DAS Portal</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/common.js"></script>
</head>
<body>

  <div class="bg-fx" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

  <div class="app">

    <!-- ============ تسجيل الدخول ============ -->
    <div id="loginScreen" class="center-wrap">
      <div class="glass login-card rise">
        <div class="logo">DAS</div>
        <h1>بوابة دعم المناديب</h1>
        <p class="sub">سجّل دخولك بكود الـ DAS الخاص بك</p>

        <form id="loginForm" autocomplete="off">
          <div class="field">
            <input type="text" id="dasInput" class="input code-input" required placeholder="ادخل كود المندوب" autocapitalize="characters" spellcheck="false" aria-label="كود المندوب">
          </div>
          <p id="loginError" class="err-text" role="alert"></p>
          <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">
            <span class="spinner"></span><span class="label">دخول للسيستم</span>
          </button>
        </form>
      </div>
    </div>

    <!-- ============ الشاشة الرئيسية ============ -->
    <div id="mainScreen" class="shell hidden">

      <header class="glass topbar rise">
        <div class="avatar" id="avatar">DA</div>
        <div class="who">
          <div class="code mono" id="courierCodeBadge">—</div>
          <div class="name" id="courierName">—</div>
        </div>
        <div class="actions">
          <button class="btn btn-ghost btn-icon theme-toggle" onclick="DAS.toggleTheme()" aria-label="تغيير المظهر">
            <svg class="ico moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="btn btn-ghost btn-icon" onclick="logout()" aria-label="خروج" title="خروج"><i data-ico="logout"></i></button>
        </div>
      </header>

      <section class="stats-row stagger">
        <div class="mini-stat warn" style="--i:1"><b id="sReview">0</b><span>قيد المراجعة</span></div>
        <div class="mini-stat bad" style="--i:2"><b id="sOffice">0</b><span>لازم المكتب</span></div>
        <div class="mini-stat ok" style="--i:3"><b id="sDone">0</b><span>اتحلت</span></div>
      </section>

      <div class="section-title rise" style="animation-delay:.15s">اختر القسم لتسجيل شكوى أو طلب</div>
      <section class="cat-grid">
        <button class="cat-card rise" style="animation-delay:.2s" onclick="openForm('الشيفت')" id="cardShift">
          <div class="ci"><i data-ico="calendar" data-cls="ico-lg"></i></div>
          <h4>الشيفت</h4>
          <p>تعديل شيفت، غياب، تبديل، حضور</p>
        </button>
        <button class="cat-card pay rise" style="animation-delay:.28s" onclick="openForm('القبض')" id="cardPayroll">
          <div class="ci"><i data-ico="wallet" data-cls="ico-lg"></i></div>
          <h4>القبض</h4>
          <p>خصومات، بونص، تقفيل، حسابات</p>
        </button>
        <button class="cat-card adv span rise" style="animation-delay:.36s" onclick="openAdvanceForm()" id="cardAdvance">
          <div class="ci"><i data-ico="banknote" data-cls="ico-lg"></i></div>
          <h4>سلفة</h4>
          <p>طلب سلفة من القبض — تحويل على محفظتك</p>
        </button>
      </section>

      <!-- فورم الشكوى -->
      <section id="ticketFormBox" class="glass form-box hidden">
        <div class="form-head">
          <h3 id="formTitle">تسجيل مشكلة</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeForm()" type="button"><i data-ico="close"></i> إغلاق</button>
        </div>
        <form id="submitTicketForm">
          <input type="hidden" id="selectedCategory">
          <div class="form-grid">
            <div class="field">
              <label for="subTypeInput">نوع المشكلة</label>
              <select id="subTypeInput" class="select"></select>
            </div>
            <div class="field">
              <label for="issueDateInput">تاريخ اليوم / الشيفت</label>
              <input type="date" id="issueDateInput" class="input" required>
            </div>
          </div>
          <div class="field" style="margin-bottom:16px">
            <label for="descInput">اشرح مشكلتك بالتفصيل</label>
            <textarea id="descInput" class="textarea" rows="4" required maxlength="600" placeholder="اكتب تفاصيل المشكلة هنا بوضوح..."></textarea>
            <div class="counter"><span id="charCount">0</span> / 600</div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">
            <span class="spinner"></span><i data-ico="send"></i><span class="label">إرسال الشكوى للإدارة</span>
          </button>
        </form>
      </section>

      <!-- فورم السلفة -->
      <section id="advanceFormBox" class="glass form-box hidden" style="border-color:color-mix(in srgb, var(--warn) 45%, transparent)">
        <div class="form-head">
          <h3>طلب سلفة</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeAdvanceForm()" type="button"><i data-ico="close"></i> إغلاق</button>
        </div>
        <form id="advanceForm">
          <div class="form-grid">
            <div class="field">
              <label for="advAmount">المبلغ المطلوب (جنيه)</label>
              <input type="number" id="advAmount" class="input" min="50" max="20000" step="50" required placeholder="500">
            </div>
            <div class="field">
              <label for="advWallet">رقم المحفظة (فودافون كاش / انستاباي)</label>
              <input type="tel" id="advWallet" class="input mono" required inputmode="numeric" pattern="[0-9]{10,13}" maxlength="13" placeholder="01xxxxxxxxx">
            </div>
          </div>
          <div class="field" style="margin-bottom:16px">
            <label for="advReason">سبب السلفة</label>
            <textarea id="advReason" class="textarea" rows="3" required maxlength="300" placeholder="اكتب سبب السلفة باختصار..."></textarea>
            <div class="counter"><span id="advCharCount">0</span> / 300</div>
          </div>
          <p id="advErr" class="err-text" role="alert"></p>
          <button type="submit" class="btn btn-primary" style="width:100%" id="advSubmitBtn">
            <span class="spinner"></span><i data-ico="send"></i><span class="label">إرسال طلب السلفة</span>
          </button>
        </form>
      </section>

      <!-- متابعة الشكاوى -->
      <section class="glass tickets-card rise" style="animation-delay:.35s">
        <div class="section-title" style="margin:0 0 16px">
          <span style="font-size:16px;color:var(--text);font-weight:800">متابعة شكاواك وحالتها</span>
          <span class="live"><i></i> تحديث تلقائي</span>
        </div>
        <div id="myTicketsList" class="ticket-list">
          <div class="skeleton" style="height:110px"></div>
          <div class="skeleton" style="height:110px"></div>
        </div>
      </section>

      <!-- متابعة السلف -->
      <section class="glass tickets-card rise" style="animation-delay:.42s">
        <div class="section-title" style="margin:0 0 16px">
          <span style="font-size:16px;color:var(--text);font-weight:800">سلفك وحالتها</span>
          <span class="live"><i></i> تحديث تلقائي</span>
        </div>
        <div id="myAdvancesList" class="ticket-list">
          <div class="skeleton" style="height:90px"></div>
        </div>
      </section>

    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentCourier = null;
    let pollInterval = null;
    let lastSig = null;
    let prevMap = {};
    let firstLoad = true;
    let myTicketsCache = [];
    let advSig = null;
    let advPrevMap = {};
    let advFirstLoad = true;

    $('issueDateInput').valueAsDate = new Date();

    // استرجاع الجلسة
    try {
      const saved = localStorage.getItem('das_courier');
      if (saved) { currentCourier = JSON.parse(saved); showMainScreen(); }
    } catch (e) {}

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = $('loginError');
      const btn = $('loginBtn');
      errEl.textContent = '';
      DAS.busy(btn, true);
      try {
        const res = await fetch('/api/courier/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ das_code: $('dasInput').value })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'خطأ في الدخول';
          const inp = $('dasInput'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
          return;
        }
        currentCourier = data.courier;
        try { localStorage.setItem('das_courier', JSON.stringify(currentCourier)); } catch (e) {}
        showMainScreen();
      } catch (err) {
        errEl.textContent = 'تعذر الاتصال بالسيرفر';
      } finally {
        DAS.busy(btn, false);
      }
    });

    function showMainScreen() {
      $('loginScreen').classList.add('hidden');
      $('mainScreen').classList.remove('hidden');
      $('courierCodeBadge').textContent = currentCourier.das_code;
      $('courierName').textContent = currentCourier.name;
      const av = $('avatar');
      av.textContent = DAS.initials(currentCourier.name);
      firstLoad = true; lastSig = null; prevMap = {};
      advFirstLoad = true; advSig = null; advPrevMap = {};
      loadMyTickets();
      loadMyAdvances();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => { loadMyTickets(); loadMyAdvances(); }, 4000);
    }

    function logout() {
      try { localStorage.removeItem('das_courier'); } catch (e) {}
      currentCourier = null;
      if (pollInterval) clearInterval(pollInterval);
      $('mainScreen').classList.add('hidden');
      $('loginScreen').classList.remove('hidden');
      $('dasInput').value = '';
      closeForm();
      closeAdvanceForm();
    }

    const OPTIONS = {
      'الشيفت': ['غياب اتسجل غلط', 'طلب تعديل شيفت', 'مشكلة حضور وانصراف', 'تبديل شيفت', 'أخرى'],
      'القبض': ['خصم غير مبرر', 'بونص منزلش', 'مشكلة في التقفيل / عجز', 'تأخر نزول القبض', 'أخرى']
    };

    function openForm(category) {
      closeAdvanceForm();
      $('selectedCategory').value = category;
      $('formTitle').textContent = `تسجيل شكوى بخصوص: ${category}`;
      const sel = $('subTypeInput');
      sel.innerHTML = OPTIONS[category].map(o => `<option value="${DAS.esc(o)}">${DAS.esc(o)}</option>`).join('');
      $('cardShift').classList.toggle('active', category === 'الشيفت');
      $('cardPayroll').classList.toggle('active', category === 'القبض');

      const box = $('ticketFormBox');
      box.classList.remove('hidden');
      box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => $('descInput').focus({ preventScroll: true }), 350);
    }

    function closeForm() {
      $('ticketFormBox').classList.add('hidden');
      $('submitTicketForm').reset();
      $('issueDateInput').valueAsDate = new Date();
      $('charCount').textContent = '0';
      $('cardShift').classList.remove('active');
      $('cardPayroll').classList.remove('active');
    }

    $('descInput').addEventListener('input', (e) => { $('charCount').textContent = e.target.value.length; });

    $('submitTicketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('submitBtn');
      DAS.busy(btn, true);
      try {
        const res = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            das_code: currentCourier.das_code,
            courier_name: currentCourier.name,
            category: $('selectedCategory').value,
            sub_type: $('subTypeInput').value,
            issue_date: $('issueDateInput').value,
            description: $('descInput').value
          })
        });
        if (res.ok) {
          closeForm();
          DAS.toast('تم إرسال الشكوى للإدارة بنجاح');
          DAS.confetti();
          await loadMyTickets();
        } else {
          DAS.toast('فشل إرسال الشكوى، حاول مرة أخرى', 'err');
        }
      } catch (err) {
        DAS.toast('تعذر الاتصال بالسيرفر', 'err');
      } finally {
        DAS.busy(btn, false);
      }
    });

    const ADV_STATUS = {
      'تمت الصرف':   { cls: 'ok',   label: 'تمت الصرف' },
      'مرفوضة':      { cls: 'bad',  label: 'مرفوضة' },
      'قيد المراجعة': { cls: 'warn', label: 'قيد المراجعة' }
    };
    const advSt = (s) => ADV_STATUS[s] || ADV_STATUS['قيد المراجعة'];

    function advBadge(status) {
      const s = advSt(status);
      return `<span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span>`;
    }

    // ---------- السلفة ----------
    function openAdvanceForm() {
      $('ticketFormBox').classList.add('hidden');
      $('cardShift').classList.remove('active');
      $('cardPayroll').classList.remove('active');
      $('cardAdvance').classList.add('active');
      const box = $('advanceFormBox');
      box.classList.remove('hidden');
      box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => $('advAmount').focus({ preventScroll: true }), 350);
    }

    function closeAdvanceForm() {
      $('advanceFormBox').classList.add('hidden');
      $('advanceForm').reset();
      $('advCharCount').textContent = '0';
      $('advErr').textContent = '';
      $('cardAdvance').classList.remove('active');
    }

    $('advReason').addEventListener('input', (e) => { $('advCharCount').textContent = e.target.value.length; });

    $('advanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = $('advErr');
      const btn = $('advSubmitBtn');
      errEl.textContent = '';
      DAS.busy(btn, true);
      try {
        const res = await fetch('/api/advances', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            das_code: currentCourier.das_code,
            amount: Number($('advAmount').value),
            reason: $('advReason').value,
            wallet: $('advWallet').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          closeAdvanceForm();
          DAS.toast('تم إرسال طلب السلفة للإدارة');
          DAS.confetti();
          await loadMyAdvances();
        } else {
          errEl.textContent = data.error || 'فشل إرسال الطلب، حاول مرة أخرى';
        }
      } catch (err) {
        errEl.textContent = 'تعذر الاتصال بالسيرفر';
      } finally {
        DAS.busy(btn, false);
      }
    });

    async function loadMyAdvances() {
      if (!currentCourier) return;
      let data;
      try {
        const res = await fetch(`/api/courier/advances/${encodeURIComponent(currentCourier.das_code)}`);
        if (!res.ok) return;
        data = await res.json();
      } catch (e) { return; }

      const advances = data.advances || [];
      const sig = JSON.stringify(advances.map(a => [a.id, a.status, a.admin_note]));
      if (sig === advSig) return;
      advSig = sig;

      const changed = new Set();
      if (!advFirstLoad) {
        advances.forEach(a => {
          const p = advPrevMap[a.id];
          if (p && (p.status !== a.status || p.admin_note !== a.admin_note)) changed.add(a.id);
        });
        if (changed.size) DAS.toast('الإدارة حدّثت حالة سلفة من سلفك');
      }
      advPrevMap = Object.fromEntries(advances.map(a => [a.id, { status: a.status, admin_note: a.admin_note }]));
      const animate = advFirstLoad;
      advFirstLoad = false;

      const container = $('myAdvancesList');
      if (!advances.length) {
        container.innerHTML = `
          <div class="empty fade">
            <div class="eic">${DAS.icon('banknote', 'ico-lg')}</div>
            <b>لا توجد سلف حتى الآن</b>
            لو محتاج سلفة اضغط على كارت السلفة فوق
          </div>`;
        return;
      }

      container.innerHTML = advances.map((a, i) => {
        const s = advSt(a.status);
        const anim = (animate || changed.has(a.id)) ? '' : 'animation:none';
        return `
        <article class="ticket s-${s.cls} ${changed.has(a.id) ? 'flash' : ''}" style="--i:${animate ? i : 0};${anim}">
          <div class="ticket-top">
            <div class="l">
              <span class="tag adv">سلفة</span>
              <span class="amt">${DAS.esc(a.amount)} ج</span>
            </div>
            ${advBadge(a.status)}
          </div>
          <p class="desc">${DAS.esc(a.reason)}</p>
          <div class="meta">المحفظة: <span class="mono">${DAS.esc(a.wallet)}</span></div>
          ${a.admin_note ? `
            <div class="reply">
              <strong>${DAS.icon('msg')} رد الإدارة</strong>
              ${DAS.esc(a.admin_note)}
            </div>` : ''}
          <div class="ticket-foot">
            <span>رقم الطلب: #${a.id}</span>
            <span>${DAS.fmtDateTime(a.created_at)}</span>
          </div>
        </article>`;
      }).join('');
    }

    const STATUS = {
      'اتحلت':            { cls: 'ok',   icon: 'checkCircle', label: 'اتحلت' },
      'لازم تيجي المكتب': { cls: 'bad',  icon: 'building',    label: 'لازم تيجي المكتب' },
      'يتم المراجعة':     { cls: 'warn', icon: 'clock',       label: 'يتم المراجعة' }
    };
    const st = (s) => STATUS[s] || STATUS['يتم المراجعة'];

    function badge(status) {
      const s = st(status);
      return `<span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span>`;
    }

    // شريط التقدم: تم الإرسال → المراجعة → النتيجة
    function steps(status) {
      const s = st(status);
      const finalLabel = s.cls === 'ok' ? 'اتحلت' : s.cls === 'bad' ? 'المكتب' : 'القرار';
      const c = s.cls === 'warn' ? 'var(--warn)' : s.cls === 'ok' ? 'var(--ok)' : 'var(--bad)';
      const reviewed = s.cls !== 'warn';
      return `
        <div class="steps" style="--c:${c}">
          <div class="step done"><span class="d"></span>تم الإرسال</div>
          <div class="bar done"></div>
          <div class="step done ${reviewed ? '' : 'now'}"><span class="d"></span>المراجعة</div>
          <div class="bar ${reviewed ? 'done' : ''}"></div>
          <div class="step ${reviewed ? 'done now' : ''}"><span class="d"></span>${finalLabel}</div>
        </div>`;
    }

    function updateStats(tickets) {
      const n = (s) => tickets.filter(t => t.status === s).length;
      DAS.countUp($('sReview'), n('يتم المراجعة'), 600);
      DAS.countUp($('sOffice'), n('لازم تيجي المكتب'), 600);
      DAS.countUp($('sDone'), n('اتحلت'), 600);
    }

    async function loadMyTickets() {
      if (!currentCourier) return;
      let data;
      try {
        const res = await fetch(`/api/courier/tickets/${encodeURIComponent(currentCourier.das_code)}`);
        if (!res.ok) return; // فشل مؤقت — الاستبيان التالي هيجرب تاني
        data = await res.json();
      } catch (e) { return; }

      const tickets = data.tickets || [];
      const sig = JSON.stringify(tickets.map(t => [t.id, t.status, t.admin_note, t.rating]));
      if (sig === lastSig) return; // مفيش تغيير، منعمل ريندر ولا نعيد الأنيمشن
      lastSig = sig;
      myTicketsCache = tickets;
      updateStats(tickets);

      // تحديد الشكاوى اللي اتغيرت من الإدارة عشان نعمل لها هايلايت
      const changed = new Set();
      let solvedNow = 0;
      if (!firstLoad) {
        tickets.forEach(t => {
          const p = prevMap[t.id];
          if (p && (p.status !== t.status || p.admin_note !== t.admin_note)) {
            changed.add(t.id);
            if (t.status === 'اتحلت' && p.status !== 'اتحلت') solvedNow++;
          }
        });
        if (changed.size) DAS.toast('الإدارة حدّثت إحدى شكاواك');
        if (solvedNow) {
          DAS.confetti();
          DAS.toast(solvedNow === 1 ? 'مبروك — شكواك اتحلت' : `مبروك — ${solvedNow} شكاوى اتحلت`);
        }
      }
      prevMap = Object.fromEntries(tickets.map(t => [t.id, { status: t.status, admin_note: t.admin_note }]));
      const animate = firstLoad;
      firstLoad = false;

      const container = $('myTicketsList');
      if (!tickets.length) {
        container.innerHTML = `
          <div class="empty fade">
            <div class="eic">${DAS.icon('inbox', 'ico-lg')}</div>
            <b>لا توجد شكاوى حتى الآن</b>
            اختر قسم من الأعلى لتسجيل أول شكوى
          </div>`;
        return;
      }

      container.innerHTML = tickets.map((t, i) => {
        const s = st(t.status);
        const catCls = t.category === 'الشيفت' ? 'shift' : 'pay';
        const anim = (animate || changed.has(t.id)) ? '' : 'animation:none';
        return `
        <article class="ticket s-${s.cls} ${changed.has(t.id) ? 'flash' : ''}" style="--i:${animate ? i : 0};${anim}">
          <div class="ticket-top">
            <div class="l">
              <span class="tag ${catCls}">${DAS.esc(t.category)}</span>
              <span class="sub">${DAS.esc(t.sub_type)}</span>
            </div>
            ${badge(t.status)}
          </div>
          <p class="desc">${DAS.esc(t.description)}</p>
          ${t.admin_note ? `
            <div class="reply">
              <strong>${DAS.icon('msg')} رد الإدارة</strong>
              ${DAS.esc(t.admin_note)}
            </div>` : ''}
          ${steps(t.status)}
          ${t.status === 'اتحلت' ? rateBox(t) : ''}
          <div class="ticket-foot">
            <span>تاريخ المشكلة: ${DAS.esc(t.issue_date)}</span>
            <span class="mono">#${t.id}</span>
          </div>
        </article>`;
      }).join('');
    }

    // ---------- تقييم الحل ----------
    const ratingPick = {};

    function starRow(sel, id, interactive) {
      return [1, 2, 3, 4, 5].map(n => `
        <button type="button" class="star ${n <= (sel || 0) ? 'on' : ''}" ${interactive ? `onclick="pickStar(${id},${n})" aria-label="${n} من 5"` : 'disabled tabindex="-1"'}>${DAS.icon('star')}</button>`).join('');
    }

    function interactiveRateBox(t) {
      const sel = ratingPick[t.id] || t.rating || 0;
      return `
      <div class="rate-box" id="rateBox-${t.id}">
        <span class="rate-label">${DAS.icon('star')} ${t.rating ? 'عدّل تقييمك للحل' : 'قيّم الحل'}</span>
        <div class="stars">${starRow(sel, t.id, true)}</div>
        <input type="text" id="rateNote-${t.id}" class="input rate-note" maxlength="150" placeholder="تعليق (اختياري)" value="${DAS.esc(t.rating_note || '')}">
        <button type="button" class="btn btn-primary btn-sm" id="rateBtn-${t.id}" onclick="submitRating(${t.id})">حفظ التقييم</button>
      </div>`;
    }

    function rateBox(t) {
      if (!t.rating) return interactiveRateBox(t);
      return `
      <div class="rate-box done" id="rateBox-${t.id}">
        <span class="rate-label">${DAS.icon('star')} تقييمك للحل</span>
        <div class="stars-view">${starRow(t.rating, t.id, false)}</div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="editRating(${t.id})">تعديل التقييم</button>
        ${t.rating_note ? `<div class="rate-note-view">${DAS.esc(t.rating_note)}</div>` : ''}
      </div>`;
    }

    function pickStar(id, n) {
      ratingPick[id] = n;
      const box = $('rateBox-' + id);
      if (box) box.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('on', i < n));
    }

    function editRating(id) {
      const t = myTicketsCache.find(x => x.id === id);
      if (!t) return;
      ratingPick[id] = t.rating;
      const box = $('rateBox-' + id);
      if (box) box.outerHTML = interactiveRateBox(t);
    }

    async function submitRating(id) {
      const n = ratingPick[id];
      const btn = $('rateBtn-' + id);
      if (!n) { DAS.toast('اختار نجمة الأول', 'err'); return; }
      DAS.busy(btn, true);
      try {
        const res = await fetch(`/api/tickets/${id}/rate`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ das_code: currentCourier.das_code, rating: n, rating_note: $('rateNote-' + id).value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'فشل حفظ التقييم');
        DAS.toast('شكرا على تقييمك');
        DAS.confetti();
        loadMyTickets();
      } catch (e) {
        DAS.toast(e.message, 'err');
      } finally {
        DAS.busy(btn, false);
      }
    }

    DAS.glow('.cat-card');
  </script>
</body>
</html>
